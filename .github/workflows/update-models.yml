name: Daily Model Registry Update

on:
  schedule:
    # Run daily at 1:00 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Needed to commit updated registry

jobs:
  update-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      # GitHub Secrets required:
      # NVAPI_KEY - NVIDIA NIM API key (get from https://build.nvidia.com/nim/dashboard)
      # OPENROUTER_API_KEY - OpenRouter API key (get from https://openrouter.ai/keys)
      NVAPI_KEY: ${{ secrets.NVAPI_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp python-dotenv openai --break-system-packages
      
      - name: Check API keys availability
        id: keys
        run: |
          if [ -z "${{ secrets.NVAPI_KEY }}" ]; then
            echo "has_nvidia_key=false" >> $GITHUB_OUTPUT
          else
            echo "has_nvidia_key=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Update model registry
        run: |
          python model_registry_updater.py --daily --output-dir ./registry
        env:
          NVAPI_KEY: ${{ secrets.NVAPI_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SKIP_HEALTH_CHECKS: ${{ steps.keys.outputs.has_nvidia_key == 'false' && 'true' || 'false' }}
      
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet registry/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to registry"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Registry has changes"
          fi
      
      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "RoutingMagic Bot"
          git config user.email "bot@routingmagic.ai"
          git add registry/
          git commit -m "chore: daily model registry update $(date -u +'%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::error::Daily model registry update failed. Check workflow logs."
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          title="Model Registry Update failed ($(date -u +'%Y-%m-%d'))"
          # Reuse an existing open alert issue if one is already there; otherwise open one.
          existing=$(gh issue list --state open --label registry-alert --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again $(date -u). Run: $run_url"
          else
            gh label create registry-alert --color B60205 --description "Automated model-registry update failures" 2>/dev/null || true
            gh issue create --label registry-alert \
              --title "$title" \
              --body "The daily model registry update workflow failed. The router and Model Council may be running on a stale free-model list. Run: $run_url"
          fi

  # Optional: Run health checks weekly (more comprehensive)
  weekly-health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event.schedule == '0 1 * * 0'  # Only on Sundays
    
    env:
      NVAPI_KEY: ${{ secrets.NVAPI_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp python-dotenv openai --break-system-packages
      
      - name: Check API keys availability
        id: keys
        run: |
          if [ -z "${{ secrets.NVAPI_KEY }}" ]; then
            echo "has_nvidia_key=false" >> $GITHUB_OUTPUT
          else
            echo "has_nvidia_key=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Run full health check
        run: |
          python model_registry_updater.py --daily --output-dir ./registry
        env:
          NVAPI_KEY: ${{ secrets.NVAPI_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SKIP_HEALTH_CHECKS: ${{ steps.keys.outputs.has_nvidia_key == 'false' && 'true' || 'false' }}
      
      - name: Commit health check results
        run: |
          git config user.name "RoutingMagic Bot"
          git config user.email "bot@routingmagic.ai"
          git add registry/
          git commit -m "chore: weekly health check update $(date -u +'%Y-%m-%d')" || echo "No changes"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}